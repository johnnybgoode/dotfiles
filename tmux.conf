#set -g default-terminal "screen-256color"
set -g default-terminal "xterm-ghostty"
set -as terminal-overrides ",*:RGB"

# Remap prefix to ctrl + g
set -g prefix C-g
unbind C-b
bind C-g send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 0
set -g history-limit 10000

set -g mouse on
set -g focus-events on

# Map vi copy keys
set -g status-keys vi
setw -g mode-keys vi

# Panes
set -g remain-on-exit off
set-hook -g window-layout-changed 'set-window -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set -g pane-border-format " #{pane_index}: #{pane_current_command} "

# Statusline
set -g status-interval 5

# Terminal title shows sess name
set -g set-titles on
set -g set-titles-string "#S // #{pane_current_command}" # [#I:#P]
set -g allow-rename on
set -g allow-set-title on

##
# Bindings
##

# Enable nested session
bind-key a send-prefix

# Map g to last window
bind g last-window

# Better pane bindings
unbind '"'
unbind %
bind | splitw -h -c "#{pane_current_path}"
bind _ splitw -v -c "#{pane_current_path}"
# Note Cmd+alt+Arrow bindings are configured by Ghostty. See iTerm2
# bindings below
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D
bind x kill-pane
bind T select-layout tiled
bind V select-layout main-vertical
bind H select-layout main-horizontal

bind m set mouse off \;\
	display-message "  Mouse disabled.."
bind M set mouse on \;\
	display-message "  Mouse enabled.."

# Map R to source .tmux.conf
unbind R
bind R source-file ~/.tmux.conf \; display-message "  Config reloaded.."
# Easier config editing
unbind E
bind E splitw -h \; send-keys "vim ~/.tmux.conf" Enter

# new agent (claude) sandbox
bind A new-window "exec claudesb" \; split-pane -v  # \; split-pane -h "exec echo 'sandbox bash'"

# tmuxline
if-shell "test -f ~/.tmuxline.conf" "source ~/.tmuxline.conf"

